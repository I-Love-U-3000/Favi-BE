services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: oasis_smoke
      POSTGRES_PASSWORD: local_oasis_only
      POSTGRES_DB: oasis_smoke
    ports:
      - "127.0.0.1:15449:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U oasis_smoke -d oasis_smoke"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16399:6379"
