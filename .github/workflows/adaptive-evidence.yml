name: Adaptive evidence consistency

on:
  pull_request:
    paths:
      - '.github/workflows/adaptive-evidence.yml'
      - 'Favi-BE/document/benchmarks/adaptive-thesis-evidence-20261108/**'
      - 'Favi-BE/document/benchmarks/adaptive-defense-readiness-20261108/**'
      - 'Favi-BE/document/benchmarks/adaptive-method-integrity-20261108/**'
      - 'Favi-BE/document/benchmarks/adaptive-confirmatory-ranking-20261108/**/tuning.json'
      - 'Favi-BE/document/benchmarks/adaptive-confirmatory-ranking-20261108/**/selection.json'
      - 'Favi-BE/tools/oasis-smoke/configs/recommenders/adaptive-v1.json'
      - 'Favi-BE/document/benchmarks/adaptive-confirmatory-ranking-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-replay-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-cost-audit-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-http-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-serving-export-20261108/provenance.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/adaptive-evidence.yml'
      - 'Favi-BE/document/benchmarks/adaptive-thesis-evidence-20261108/**'
      - 'Favi-BE/document/benchmarks/adaptive-defense-readiness-20261108/**'
      - 'Favi-BE/document/benchmarks/adaptive-method-integrity-20261108/**'
      - 'Favi-BE/document/benchmarks/adaptive-confirmatory-ranking-20261108/**/tuning.json'
      - 'Favi-BE/document/benchmarks/adaptive-confirmatory-ranking-20261108/**/selection.json'
      - 'Favi-BE/tools/oasis-smoke/configs/recommenders/adaptive-v1.json'
      - 'Favi-BE/document/benchmarks/adaptive-confirmatory-ranking-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-replay-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-cost-audit-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-http-20261108/summary.json'
      - 'Favi-BE/document/benchmarks/adaptive-serving-export-20261108/provenance.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-evidence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    name: Evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
        working-directory: Favi-BE
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tracked tables without regenerating them
        run: ./document/benchmarks/adaptive-thesis-evidence-20261108/build-evidence.ps1 -Check
      - name: Check newline portability and tamper rejection
        run: ./document/benchmarks/adaptive-thesis-evidence-20261108/test-portability.ps1 -Output .tools/evidence-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check archived audit process isolation
        env:
          PYTHONOPTIMIZE: '1'
        run: python -B -X utf8 -m unittest discover -s document/benchmarks/adaptive-defense-readiness-20261108 -p test_isolation.py -v
      - name: Audit saved validation selection and negative controls
        run: |
          python -I -B -X utf8 -m unittest discover -s document/benchmarks/adaptive-method-integrity-20261108 -p test_selection.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -X utf8 document/benchmarks/adaptive-method-integrity-20261108/audit_selection.py --output .tools/evidence-ci/selection-summary.json
      - name: Keep verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-evidence-${{ matrix.os }}
          path: |
            Favi-BE/.tools/evidence-ci/results.txt
            Favi-BE/.tools/evidence-ci/selection-summary.json
          if-no-files-found: warn
          retention-days: 7
