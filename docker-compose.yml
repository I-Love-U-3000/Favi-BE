services:
  # ===== API Gateway & Load Balancer (NGINX L7) =====
  gateway:
    image: nginx:alpine
    container_name: favi-gateway
    restart: unless-stopped
    ports:
      - "5000:80" # http://localhost:5000 (Preserves frontend & Postman compatibility)
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
      - ./Favi-BE/Favi-BE.API/wwwroot/seed-assets:/var/www/seed-assets:ro
