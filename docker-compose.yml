      - ./Favi-BE/Favi-BE.API/wwwroot/seed-assets:/app/wwwroot/seed-assets:ro
    networks:
      - favi-network

  # ===== Postgres cho Favi =====
  favi-postgres:
    image: postgres:15
    container_name: favi-postgres
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
    environment:
      POSTGRES_DB: favi
      POSTGRES_USER: favi
      POSTGRES_PASSWORD: favi
    ports:
      - "5432:5432"
    volumes:
      - favi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U favi -d favi" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - favi-network

  # ===== Vector Index Monolith (FastAPI + OpenCLIP) =====
  vector-index-api:
    build:
      context: ./Vector-index-api
      dockerfile: ./VectorIndexApi.Dockerfile
    container_name: favi-vector-api
    environment:
      QDRANT_URL: http://qdrant:6333
      FRIENDS_URL: http://gateway:80
      REDIS_URL: redis://redis:6379/0
      COLLECTION_NAME: posts_demo
      MODEL_NAME: ViT-B-32
      PRETRAINED: openai
      RL_SEARCH_PER_MIN: "120"
      RL_POST_PER_MIN: "1200"
      RL_BULK_PER_MIN: "1200"
      BULK_EMBED_BATCH: "64"
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./Favi-BE/Favi-BE.API/wwwroot/seed-assets:/app/wwwroot/seed-assets:ro
    ports:
      - "18080:8080"
    networks:
      - favi-network

  # ===== Qdrant + Redis (Vector & Cache) =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: favi-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - favi-network

  redis:
    image: redis:7-alpine
    container_name: favi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - favi-network

  # ===== Monitoring: NGINX Prometheus Exporter =====
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: favi-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://gateway:80/nginx_status
    depends_on:
      - gateway
    networks:
      - favi-network

  # ===== Monitoring: Prometheus =====
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: favi-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - favi-network

  # ===== Monitoring: Grafana =====
  grafana:
    image: grafana/grafana:10.4.1
    container_name: favi-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3050:3000" # http://localhost:3050 (Frees 3000 and 3001 for frontend Next.js)
    depends_on:
      - prometheus
    networks:
      - favi-network

volumes:
  favi_pgdata:
  qdrant_storage:
  redis_data:
  grafana_data:

networks:
  favi-network:
    driver: bridge
