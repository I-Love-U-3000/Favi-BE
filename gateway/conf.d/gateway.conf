# Upstream cluster for Favi .NET Core API (General REST API)
upstream favi_api_cluster {
    least_conn;
    server favi-api-1:8080 max_fails=3 fail_timeout=10s;
    server favi-api-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Sticky Session Upstream for SignalR (Ensures negotiate + WebSockets hit the same instance)
upstream favi_signalr_cluster {
    ip_hash;
    server favi-api-1:8080 max_fails=3 fail_timeout=10s;
    server favi-api-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Upstream cluster for Vector Index / AI API (FastAPI)
upstream vector_api_cluster {
    least_conn;
    server vector-index-api:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost _;

    # Global payload limits (for JSON requests)
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffer settings for performance under load
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # Passive Failover: Try next replica if one returns 502/503/504 or error
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Request-ID $request_id;

    # Security & Tracing Headers on Responses
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 1. Real-time NGINX Status (for Prometheus Exporter)
    location /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # 2. Static Seed Assets (Serve directly from disk, bypass .NET completely)
    location /seed-assets/ {
        alias /var/www/seed-assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # 3. Health Check Endpoints
    location ~* ^/health(/.*)?$ {
        proxy_pass http://favi_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 4. Auth Endpoints (Strict Rate Limiting, No Idempotency Required)
    location ~* ^/api/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://favi_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. File Upload Endpoints (Permit up to 25MB multipart payloads)
    location ~* ^/api/(posts|profile/avatar|media|upload)(/.*)?$ {
        client_max_body_size 25M;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://favi_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Vector Search & NSFW AI Endpoints
    location ~* ^/api/v1/(search/vector|nsfw)(/.*)?$ {
        limit_req zone=search_limit burst=10 nodelay;
        proxy_pass http://vector_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. SignalR WebSocket Endpoints (Chat, Notifications, Calls) - STICKY SESSION
    location ~* ^/(chatHub|notificationHub|callHub)(/.*)?$ {
        proxy_pass http://favi_signalr_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 8. Swagger / Scalar / OpenAPI Documentation
    location ~* ^/(swagger|scalar|openapi)(/.*)?$ {
        proxy_pass http://favi_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 9. General API Endpoints (.NET Backend Cluster)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://favi_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default fallback
    location / {
        proxy_pass http://favi_api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
